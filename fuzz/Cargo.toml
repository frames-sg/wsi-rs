[package]
name = "wsi-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wsi-rs = { path = "..", features = ["fuzzing"] }
tempfile = "3"

[[bin]]
name = "open_wsi_bytes"
path = "fuzz_targets/open_wsi_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_jp2k_codestream_bytes"
path = "fuzz_targets/open_jp2k_codestream_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_svcache_bytes"
path = "fuzz_targets/open_svcache_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_xml_bytes"
path = "fuzz_targets/parse_xml_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_dicom_bytes"
path = "fuzz_targets/open_dicom_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_zvi_bytes"
path = "fuzz_targets/open_zvi_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_mirax_bundle_bytes"
path = "fuzz_targets/open_mirax_bundle_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_vms_bundle_bytes"
path = "fuzz_targets/open_vms_bundle_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_vsi_bundle_bytes"
path = "fuzz_targets/open_vsi_bundle_bytes.rs"
test = false
doc = false
bench = false

[workspace]

# J2K is consumed from its main branch until a release contains the TIFF LZW
# decoder used for TIFF-flavored LZW (frames-sg/j2k main). Remove this section once
# that release is on crates.io; crates.io rejects git dependencies.
[patch.crates-io]
j2k = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-codec-math = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-core = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-cuda = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-cuda-build-support = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-cuda-j2k-engine = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-cuda-runtime = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-jpeg = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-metal = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-metal-support = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-native = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-profile = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
j2k-tilecodec = { git = "https://github.com/frames-sg/j2k", rev = "9e5d66ed61d07746f357fa17138e6538bcc3ae14" }
