[package]
name = "wsi-rs-perf"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wsi-rs-test-support = { path = "../test-support" }

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
# Keep pixel verification off the software SHA-256 hot path, consistently
# with the reader. Runtime CPU detection retains the portable fallback.
sha2 = { version = "0.10", features = ["asm"] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
