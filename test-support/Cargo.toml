[package]
name = "wsi-rs-test-support"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libloading.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
# Keep corpus and library hashing off the software SHA-256 path, consistently
# with the reader. Runtime CPU detection retains the portable fallback.
sha2 = { version = "0.10", features = ["asm"] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
