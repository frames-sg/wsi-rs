[package]
name = "wsi-rs-test-support"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libloading.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
