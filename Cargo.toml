[package]
name = "wsi-rs"
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "wsi-rs whole-slide image reader"
repository = "https://github.com/frames-sg/wsi-rs"
homepage = "https://github.com/frames-sg/wsi-rs"
documentation = "https://docs.rs/wsi-rs"
authors = ["wsi-rs contributors"]
keywords = ["whole-slide", "microscopy", "tiff", "pathology"]
categories = ["multimedia::images", "science"]
# MSRV policy: track the latest stable Rust release. Bumping `rust-version`
# is a minor-version bump for this crate.
rust-version = "1.96"
readme = "README.md"
exclude = [
    "fuzz/**",
    "scripts/**",
    ".github/**",
    "typos.toml",
]
# Disable cargo's auto-discovery of binaries from src/bin/*.rs so only
# intentionally listed command binaries are built.
autobins = false

[features]
default = []
# Exposes parser entry points used only by the separate cargo-fuzz package.
fuzzing = []
# Exposes read-only process counters used by the OpenSlide performance shim.
# This is intentionally off for ordinary library builds.
route-telemetry = []
# Enables OpenSlide compatibility-oracle parity tests via libloading.
# Off by default; CI matrix runs with and without.
parity-openslide = []
# Enables Metal-backed parity comparisons (j2k CPU vs Metal).
# Off by default; macOS only; CI matrix runs with and without.
parity-metal = ["metal"]
# Enables Metal-backed device payloads.
metal = [
    "dep:objc2",
    "dep:objc2-metal",
    "dep:j2k-metal",
    "dep:j2k-metal-support",
]
cuda = [
    "dep:j2k-cuda",
    "dep:j2k-cuda-runtime",
    "j2k-cuda/cuda-runtime",
]

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "png", "pnm"] }
quick-xml = "0.41"
lru = "0.18.2"
memchr = { version = "2.8", default-features = false }
thiserror = "2"
sha2 = "0.10"
byteorder = "1"
tracing = "0.1"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
tempfile = "3"
zstd = "0.13"
weezl = "0.1.12"
j2k-jpeg = "0.10.0"
j2k-core = "0.10.0"
j2k-tilecodec = "0.10.0"
j2k = "0.10.0"
jxr = "0.1.0"
j2k-metal = { version = "0.10.0", optional = true }
j2k-metal-support = { version = "0.10.0", optional = true }
j2k-cuda = { version = "0.10.0", optional = true, default-features = false }
j2k-cuda-runtime = { version = "0.10.0", optional = true }
objc2 = { version = "=0.6.4", optional = true, default-features = false, features = ["std"] }
objc2-metal = { version = "=0.3.2", optional = true, default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "MTLBuffer",
    "MTLBlitCommandEncoder",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }
dicom-core = "0.9"
dicom-object = "0.9"
dicom-dictionary-std = "0.9"
dicom-parser = "0.9"
dicom-transfer-syntax-registry = { version = "0.9", default-features = false }
cfb = "0.14.0"
czi-rs = "0.1.0"

[dev-dependencies]
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.6"
tempfile = { workspace = true }
toml = "0.8"
j2k-native = "0.10.0"
syn = { version = "2", features = ["full", "visit"] }
wsi-rs-test-support = { path = "test-support" }

[[bin]]
name = "svcache"
path = "src/bin/svcache.rs"

[workspace]
members = [".", "perf-runner", "test-support", "xtask", "wsi-rs-openslide-shim"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frames-sg/wsi-rs"
homepage = "https://github.com/frames-sg/wsi-rs"
documentation = "https://docs.rs/wsi-rs"
authors = ["wsi-rs contributors"]

[workspace.dependencies]
libloading = "0.8"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"

[profile.dev]
debug = "line-tables-only"

[lints]
workspace = true

[package.metadata.docs.rs]
no-default-features = true
features = []
