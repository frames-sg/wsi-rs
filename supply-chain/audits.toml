[[audits.j2k-cuda-j2k-engine]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
delta = "0.12.0 -> 0.13.1@git:f4667dc9fc1da77f978ffb899ed674ce5c0c9142"
notes = "Reviewed the 0.12.0-to-pinned-source delta: host/device ABI layouts, bounded IDWT band windows, signed sample stores, DWT origin validation, pooled quantization ranges, chunked HT encode budgets, and packet-header scratch ownership. Kernel geometry remains bounded by validated host requests; shared tag-tree arrays fit the compile-time 48 KiB arena, serial fallback initializes its disjoint arrays, header bit buffers cap writes at 256 bits, and payload/header capacities remain checked. The maintenance branch is the published 0.13.0 tag plus PR #290's fix and tests, with the fixed engine version set to 0.13.1 and its adapter requirement updated. Eligibility and overflow now have one scratch slot per lane, a barrier, and a single thread reducing shared flags; no added allocations or barriers. The original fix passed all six packetization tests with required CUDA/PTX, zero memcheck errors, and zero INFO-level racecheck hazards on RTX 4070 SUPER (PR #290, GPU validation run 40442627185). That hardware result covers the identical fixed packetizer code; the backport's WSI integration is validated separately. The published registry 0.13.0 remains rejected by its exact-version violation. This source review does not claim exhaustive codec conformance or validation of all GPU models."

[[audits.j2k-cuda-j2k-engine]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
violation = "=0.13.0"
notes = "Published 0.13.0 adds write/write races in src/cuda_oxide_j2k_encode/simt/src/parallel_header.rs:187-190 and 337. Multiple threads write FLAG_SERIAL or FLAG_ANY_DATA in the same shared scratch.flags slots; store_u32 calls simt_store, which is an ordinary raw-pointer assignment in j2k-cuda-build-support/src/cuda_oxide_simt_prelude.rs. The following sync_threads barrier orders later reads but does not order the conflicting writes. The ANY_DATA race is reached by ordinary packets with coded blocks in multiple lanes, even though every writer stores 1. CUDA data races violate the memory model (https://docs.nvidia.com/cuda/archive/13.2.2/cuda-programming-guide/05-appendices/cuda-cpp-memory-model.html). Require atomic flag updates or disjoint per-thread flags reduced by one thread, then a CUDA racecheck regression before accepting a fixed release. Reproduced on an RTX 4070 SUPER with Compute Sanitizer 2026.1.1.0: the existing four-block native/CUDA byte comparison passed, but racecheck with --racecheck-detect-level info --print-level info reported 12 WAW hazards at the same packetizer write instruction and exited 99. The default warning level reported no hazards. These are identical-value flag writes; output corruption or memory disclosure was not demonstrated. A local unpublished J2K fix uses disjoint per-thread scratch slots and thread-0 reduction for eligibility and overflow flags. With required CUDA runtime and PTX generation, all six packetization tests, including expanded warp/chunk-boundary and overflow/fallback cases, passed memcheck with zero errors and INFO-level racecheck with zero hazards on the same GPU. The published 0.13.0 package remains unchanged, so this exact-version violation remains. Other engine source changes are not certified by this record."

