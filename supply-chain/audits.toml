[[audits.jxr-core]]
who = "Claude-assisted source review"
criteria = "safe-to-deploy"
delta = "0.1.0 -> 0.1.1"
notes = "Reviewed the exact published package diff. Adds the doc-hidden device_plan module: host-side word-array planning for the Metal and CUDA adapters. The crate still forbids unsafe code, and the module performs no filesystem, network, process or environment access. Offset, stride and index conversions use checked arithmetic with typed errors. The overlap scheduler relies on caller-validated plane geometry for some unchecked u32 edge arithmetic; pathological geometry can panic in debug builds or build oversized schedules, while out-of-range indices are rejected by checked conversion. Only jxr-metal and jxr-cuda use the module; the CPU decode path does not."

