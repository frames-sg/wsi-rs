
# cargo-vet audits file

[[audits.jxr]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
version = "0.1.1"
notes = "Reviewed the exact published registry package and VCS provenance, manifests, runtime capabilities and unsafe-code policy. Source forbids unsafe code; no runtime filesystem, network, subprocess or environment access was found. Reviewed facade ownership, strict device selection and CPU fallback boundaries. Optional accelerator implementations remain separate dependencies. CPU decode and CZI/TIFF JPEG XR integration tests exercise this pinned facade."

