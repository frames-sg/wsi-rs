[[audits.j2k-jpeg]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
delta = "0.12.0 -> 0.13.0"
notes = "Reviewed the exact published delta against the existing 0.12.0 acceptance, focusing on variable-width Huffman tables, cache/allocation ownership, encoder spare-capacity writes and NEON bounds. Raw lookup pointers retain their table lifetime and are indexed by a bounded 15-bit peek shifted by the matching construction metadata. Canonical tables validate counts and over-subscribed codes before allocation. The speculative entropy writer requires 512 bytes of both physical spare capacity and logical budget; its maximum stuffed output plus speculative word is below that bound. Plane conversion checks dimensions/capacity, writes logical pixels and padding before set_len, and handles short NEON tails within fixed arrays. No new runtime filesystem, network or subprocess access. This source acceptance is not a claim of exhaustive JPEG conformance or testing every architecture."

