notes = "Reviewed the published manifest/build script and the ownership boundaries exercised by the binding: Bound/Py lifetimes and reference release, frozen-class access, copied PyBytes, Python detach/reattach guards, and callback error/panic conversion. Rust panics are caught before crossing the C ABI; detach requires Ungil and an RAII guard restores interpreter attachment on unwind. Python-owned byte results copy the native slice rather than borrowing a slide buffer. Build-time interpreter configuration is delegated to the separately reviewed exact-version helper. Acceptance covers the current stable-ABI reader integration; it is not a sandbox for arbitrary Python code or a claim of exhaustive review of optional conversions and experimental APIs."

[[audits.pyo3-build-config]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
version = "0.30.1"
notes = "Reviewed the published manifest and configuration implementation, including interpreter discovery, config serialization, ABI/version selection, environment handling and linker output. Build helpers intentionally read Cargo/PYO3 and virtual-environment configuration, run the selected Python interpreter with packaged scripts through stdin, inspect sysconfig data and invoke the configured RUSTC with --version. Commands use argument APIs rather than shell interpolation; no network fetch or hidden runtime action was found. Cross-compilation/config-file paths are build inputs, not slide inputs. Environment mutation is confined to documented build-script helpers."

[[audits.pyo3-ffi]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
version = "0.30.1"
notes = "Reviewed the published manifest, build-time version/ABI guards and C-ABI boundaries used by the binding, including object layout gating, integer widths, bytes, reference ownership and interpreter attach/detach calls. APIs requiring version-specific structures are conditionally compiled; stable-ABI configuration is forwarded by pyo3-build-config. Raw pointers and extern calls remain explicitly unsafe and rely on the linked interpreter contract. Build scripts emit link/configuration metadata and reject unsupported combinations unless a caller deliberately sets an unsafe override; none is enabled here. Acceptance is for the abi3-py310 integration, not independent verification of every interpreter implementation."

[[audits.pyo3-macros]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
version = "0.30.1"
notes = "Reviewed the entire published macro entry-point source and manifest. Attribute and derive inputs are parsed with syn and delegated to the exact-version pyo3-macros-backend; invalid inputs become compile_error tokens. No build script, unsafe execution, filesystem, network, environment or subprocess access is present in this entry-point crate. Generated runtime wrappers are reviewed with the backend and PyO3 library."

[[audits.pyo3-macros-backend]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
version = "0.30.1"
notes = "Reviewed the published manifest, build script, method/function wrapper generation and class ownership/threading assertions for the binding integration. Generated calls pass through PyO3 trampolines and typed extraction/return conversion; normal classes assert Send/Sync, while unsendable classes use their explicit thread-checking policy. The build script reads only PYO3_WIP_NO_STD and emits a cfg. Macro execution constructs Rust tokens rather than accessing slide inputs, executing commands or fetching code. Acceptance covers macros used by the current frozen-class, stable-ABI binding, without claiming exhaustive validation of optional async/introspection features."

[[audits.sha2-asm]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
version = "0.6.4"
notes = "Reviewed the published MIT package manifest, build.rs, Rust facade, and macOS/aarch64 assembly selected by its build script for this project's target-restricted use. The build script reads Cargo target architecture/vendor and invokes the existing cc dependency on packaged assembly; no runtime filesystem, network or subprocess access is present. The selected assembly reads a fixed 32-byte state and 64-byte input block, uses a bounded 64-byte stack frame, preserves the required callee-saved registers, and writes only the state. wsi-rs does not call this facade directly: enabling sha2 0.10.9's asm feature on macOS/aarch64 selects sha2's own CPU-feature-guarded ARM intrinsics with its software fallback. Independent hash vectors across padding/file boundaries pass in accelerated and forced-software configurations. Other target configurations retain the previous sha2 feature set. This acceptance is for the reviewed integration, not a claim of formal cryptographic verification or testing every assembly target."

[[audits.syn]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
delta = "2.0.119 -> 3.0.9"
notes = "Reviewed the published manifest and parser delta against the existing syn 2.0.119 acceptance, with particular attention to token cursor operations, new syntax parsing, error ranges, and generated visitor changes. No dependency or build script is added. The new raw cursor advance only follows a matched punctuation entry; prev_span retains its start-of-buffer guard. Other changes represent Rust syntax as owned AST values and update parse/print/visit code. No filesystem, network, subprocess, or environment access is added. This compiler-input parser review is not a claim of exhaustive Rust grammar conformance."

[[audits.target-lexicon]]
who = "Codex-assisted source review"
