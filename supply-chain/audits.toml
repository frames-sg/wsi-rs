
# cargo-vet audits file

[[audits.j2k]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
delta = "0.12.0 -> 0.13.0"
notes = "Reviewed the exact published delta against the existing 0.12.0 acceptance, focusing on batch admission, retained workspaces, decode/output contracts and lossy-candidate reuse. The new shared worker cache uses exclusive try_lock ownership, discards poisoned workspaces, and caps retention at 256 MiB; concurrent calls use per-call workers. Host-memory queries and Linux cgroup reads only size admission and retain the checked per-request allocation budgets. Lossy candidate reuse keeps owned state and releases it before retrying a memory-constrained validation decode. No new unsafe code, network access, subprocess, or filesystem writes. Codec implementations and optional adapters have separate acceptance records."

