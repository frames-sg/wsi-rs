name: CUDA validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  J2K_REQUIRE_CUDA_RUNTIME: "1"
  J2K_REQUIRE_CUDA_OXIDE_BUILD: "1"
  RUSTFLAGS: "-D warnings"
  RUST_TEST_THREADS: "1"

jobs:
  cuda-runtime:
    name: CUDA resident decode validation
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'jcwal1516' && github.triggering_actor == 'jcwal1516' }}
    runs-on: [self-hosted, Linux, X64, cuda]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-11
        with:
          toolchain: "1.99.0"
      - name: Configure CUDA Oxide bindgen
        run: scripts/configure-cuda-oxide.sh
      - name: Run fail-closed CUDA library tests
        run: cargo test --locked --lib --features cuda
