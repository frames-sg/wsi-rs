name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      registry_publish: ${{ steps.release-kind.outputs.registry_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-11
        with:
          toolchain: "1.99.0"
      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: cargo-deny@0.19.4,cargo-machete@0.9.2
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version 0.10.2
      - name: Validate dependency policy
        run: cargo xtask deps
      - name: Test release policy behavior
        run: scripts/publish-crate-test.sh
      - name: Determine release destination
        id: release-kind
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as handle:
              registry_publish = tomllib.load(handle)["package"].get("publish") is not False
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"registry_publish={str(registry_publish).lower()}\n")
          PY
      - name: Validate release identity
        run: scripts/publish-crate.sh --verify
      - name: Validate release identity and package
        if: steps.release-kind.outputs.registry_publish == 'true'
        run: scripts/publish-crate.sh --dry-run

  publish-wsi-rs:
    if: github.event_name == 'push' && needs.preflight.outputs.registry_publish == 'true'
    needs: preflight
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-11
        with:
          toolchain: "1.99.0"
      - name: Obtain short-lived crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish exact tagged release
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: scripts/publish-crate.sh --publish
