name: python-wheels

# Builds abi3 wheels (Python 3.10+) and an sdist for the wsi-rs Python
# bindings. A published GitHub release attaches them to the release and
# publishes them to PyPI through trusted publishing; pull requests that touch
# the bindings and manual runs only build and test them.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/python-wheels.yml"
      - "wsi-rs-python/**"
  workflow_dispatch:

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MATURIN_VERSION: "1.15.0"

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("wsi-rs-python/Cargo.toml", "rb") as handle:
              version = tomllib.load(handle)["package"]["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag} does not match wsi-rs-python {version}")
          PY

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28", name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28", name: linux-aarch64 }
          - { os: macos-15, target: aarch64, manylinux: "off", name: macos-arm64 }
          - { os: macos-15-intel, target: x86_64, manylinux: "off", name: macos-x86_64 }
          - { os: windows-latest, target: x64, manylinux: "off", name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Wheels build from the committed Cargo.lock, like the packaged crate.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: "1.99.0"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --manifest-path wsi-rs-python/Cargo.toml --out dist
      # The oldest Python the abi3 wheel supports.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - name: Test the wheel
        shell: bash
        run: |
          python -m pip install --no-deps --no-index --find-links dist wsi-rs
          python -m unittest discover -s wsi-rs-python/tests -v
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --manifest-path wsi-rs-python/Cargo.toml --out dist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  attach-to-release:
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Attach the wheels and sdist to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

  publish-pypi:
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wsi-rs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
