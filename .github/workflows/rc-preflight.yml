name: RC Preflight

on:
  workflow_dispatch:
    inputs:
      artifacts_only:
        description: "Build C artifacts only, reusing the source preflight named below"
        type: boolean
        default: false
      source_preflight_run_id:
        description: "With artifacts_only: ID of an RC Preflight run whose source preflight passed on this commit"
        type: string
        default: ""
      performance_release_tag:
        description: "Release containing current.json.gz, previous.json.gz, and openslide.json.gz for source preflight"
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  source-preflight:
    if: ${{ !inputs.artifacts_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-rs
          fetch-depth: 0
          persist-credentials: false
      - name: Load reviewed performance captures for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_RELEASE_TAG: ${{ inputs.performance_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PERFORMANCE_RELEASE_TAG" || {
            echo "::error::source preflight requires performance_release_tag"
            exit 1
          }
          capture_dir="$RUNNER_TEMP/release-performance"
          mkdir -p "$capture_dir"
          gh release download "$PERFORMANCE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --dir "$capture_dir" \
            --pattern current.json.gz --pattern previous.json.gz --pattern openslide.json.gz
          gzip -d "$capture_dir/current.json.gz" "$capture_dir/previous.json.gz" "$capture_dir/openslide.json.gz"
          python3 - "$capture_dir/current.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              capture = json.load(handle)
          source = capture["metadata"]["git"]
          if source["commit"] != os.environ["GITHUB_SHA"] or source["dirty"]:
              raise SystemExit("current performance capture must measure this commit from a clean checkout")
          PY
          printf 'WSI_RS_RC_CURRENT_CAPTURE=%s/current.json\n' "$capture_dir" >> "$GITHUB_ENV"
          printf 'WSI_RS_RC_PREVIOUS_CAPTURE=%s/previous.json\n' "$capture_dir" >> "$GITHUB_ENV"
          printf 'WSI_RS_RC_OPENSLIDE_CAPTURE=%s/openslide.json\n' "$capture_dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 2026-07-11
        with:
          toolchain: nightly-2026-08-13
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 2026-07-11
        with:
          toolchain: "1.99.0"
          components: rustfmt,clippy
      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: cargo-nextest@0.9.136,cargo-hack@0.6.44,cargo-public-api@0.52.0,cargo-semver-checks@0.50.0,cargo-fuzz@0.13.1,cargo-deny@0.19.4,cargo-machete@0.9.2
          fallback: cargo-install
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version 0.10.2
      - run: cargo xtask rc-preflight
        working-directory: wsi-rs

  verify-source-preflight:
    if: ${{ inputs.artifacts_only }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a passing source preflight for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_preflight_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::artifacts_only requires source_preflight_run_id"
            exit 1
          fi
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          if [[ "$(jq -r .path <<<"$run")" != ".github/workflows/rc-preflight.yml" ]]; then
            echo "::error::run $RUN_ID is not an RC Preflight run"
            exit 1
          fi
          if [[ "$(jq -r .head_sha <<<"$run")" != "$GITHUB_SHA" ]]; then
            echo "::error::run $RUN_ID tested a different commit"
            exit 1
          fi
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("source-preflight"))]
                  | length > 0 and all(.conclusion == "success")')"
          if [[ "$passed" != "true" ]]; then
            echo "::error::run $RUN_ID has no passing source-preflight jobs"
            exit 1
          fi

  c-artifacts:
    name: C artifact (${{ matrix.target }})
    needs: verify-source-preflight
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.verify-source-preflight.result) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            architecture: x86_64
            gpu-feature: cuda
            cargo-library: libwsi_rs_openslide_shim.so
            artifact: libopenslide.so.1
          - os: macos-15
            target: macos-arm64
            architecture: arm64
            gpu-feature: metal
            cargo-library: libwsi_rs_openslide_shim.dylib
            artifact: libopenslide.1.dylib
          - os: macos-15-intel
            target: macos-x64
            architecture: x86_64
            gpu-feature: metal
            cargo-library: libwsi_rs_openslide_shim.dylib
            artifact: libopenslide.1.dylib
          - os: windows-latest
            target: windows-x64
            architecture: x86_64
            gpu-feature: cuda
            cargo-library: wsi_rs_openslide_shim.dll
            artifact: libopenslide-1.dll
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-rs
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned 2026-07-11
        with:
          toolchain: "1.99.0"
      - uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install ELF identity tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
      - name: Build GPU-enabled shim
        working-directory: wsi-rs
        run: cargo build --locked --release -p wsi-rs-openslide-shim --features wsi-rs/${{ matrix.gpu-feature }}
      - name: Prepare official OpenSlide 4.0.1 headers
        shell: bash
        run: |
          include_dir="${RUNNER_TEMP}/openslide-4.0.1"
          mkdir -p "${include_dir}"
          curl --fail --location --retry 3 --output "${include_dir}/openslide.h" \
            https://raw.githubusercontent.com/openslide/openslide/v4.0.1/src/openslide.h
          curl --fail --location --retry 3 --output "${include_dir}/openslide-features.h" \
            https://raw.githubusercontent.com/openslide/openslide/v4.0.1/src/openslide-features.h
      - name: Prepare ELF artifact
        if: runner.os == 'Linux'
        working-directory: wsi-rs
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/wsi-rs-artifact"
          mkdir -p "${artifact_dir}"
          cp "target/release/${{ matrix.cargo-library }}" "${artifact_dir}/${{ matrix.artifact }}"
          patchelf --set-soname '${{ matrix.artifact }}' "${artifact_dir}/${{ matrix.artifact }}"
      - name: Prepare Mach-O artifact
        if: runner.os == 'macOS'
        working-directory: wsi-rs
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/wsi-rs-artifact"
          mkdir -p "${artifact_dir}"
          cp "target/release/${{ matrix.cargo-library }}" "${artifact_dir}/${{ matrix.artifact }}"
          install_name_tool -id '@rpath/${{ matrix.artifact }}' "${artifact_dir}/${{ matrix.artifact }}"
      - name: Prepare PE artifact
        if: runner.os == 'Windows'
        working-directory: wsi-rs
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "wsi-rs-artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item "target/release/${{ matrix.cargo-library }}" (Join-Path $artifactDir "${{ matrix.artifact }}")
      - name: Generate checksum, unsigned metadata, and SBOMs
        working-directory: wsi-rs
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/cargo-metadata.json"
          python3 scripts/generate-release-artifact-metadata.py \
            --artifact "${RUNNER_TEMP}/wsi-rs-artifact/${{ matrix.artifact }}" \
            --target '${{ matrix.target }}' \
            --gpu-feature '${{ matrix.gpu-feature }}' \
            --cargo-metadata "${RUNNER_TEMP}/cargo-metadata.json" \
            --output-dir "${RUNNER_TEMP}/wsi-rs-artifact"
      - name: Verify architecture, identity, dependencies, exports, and C ABI
        working-directory: wsi-rs
        # Use the platform default shell: Git Bash shadows MSVC link.exe on Windows.
        run: >-
          cargo xtask artifact-smoke
          "${{ runner.temp }}/wsi-rs-artifact/${{ matrix.artifact }}"
          "${{ runner.temp }}/openslide-4.0.1"
          '${{ matrix.architecture }}'
          "${{ runner.temp }}/wsi-rs-artifact/artifact-metadata.json"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/wsi-rs-artifact/*
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wsi-rs-openslide-${{ matrix.target }}-unsigned
          path: ${{ runner.temp }}/wsi-rs-artifact
          if-no-files-found: error
